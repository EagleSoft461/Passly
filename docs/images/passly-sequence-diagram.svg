<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%" style="background-color: #fcfcfc; font-family: sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="500" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">Passly — Authorization Code + PKCE Flow (Sequence)</text>

  <!-- Lifelines -->
  <!-- Client, auth-server, IdP, Redis, PostgreSQL, resource-server -->
  <!-- x positions -->
  <!-- Client: 100, auth-server: 320, IdP: 540, Redis: 700, Postgres: 850, resource-server: 950 -->

  <g font-size="13" font-weight="bold">
    <rect x="40" y="60" width="140" height="36" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="110" y="83" text-anchor="middle" fill="#581c87">Client</text>

    <rect x="250" y="60" width="140" height="36" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="320" y="83" text-anchor="middle" fill="#166534">auth-server</text>

    <rect x="470" y="60" width="140" height="36" rx="6" fill="#f0f7ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="540" y="83" text-anchor="middle" fill="#1e3a8a">Google/GitHub</text>

    <rect x="640" y="60" width="120" height="36" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="700" y="83" text-anchor="middle" fill="#be123c">Redis</text>

    <rect x="790" y="60" width="130" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="855" y="83" text-anchor="middle" fill="#9a3412">PostgreSQL</text>
  </g>

  <!-- Lifelines (vertical dashed) -->
  <line x1="110" y1="96" x2="110" y2="850" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="320" y1="96" x2="320" y2="850" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="540" y1="96" x2="540" y2="850" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="700" y1="96" x2="700" y2="850" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="855" y1="96" x2="855" y2="850" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Step 1: Client -> auth-server: GET /oauth2/authorize -->
  <line x1="110" y1="140" x2="315" y2="140" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="120" y="132" font-size="12.5" font-weight="bold" fill="#111">1. GET /oauth2/authorize</text>
  <text x="120" y="150" font-size="11.5" fill="#555">?state=...&amp;code_challenge=...</text>

  <!-- Step 2: auth-server -> Redis: store state/PKCE -->
  <line x1="325" y1="185" x2="695" y2="185" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="360" y="177" font-size="12.5" font-weight="bold" fill="#111">2. Store state + code_challenge</text>
  <text x="360" y="195" font-size="11.5" fill="#555">(TTL: 5 min)</text>

  <!-- Step 3: auth-server -> IdP: redirect user -->
  <line x1="325" y1="230" x2="535" y2="230" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="335" y="222" font-size="12.5" font-weight="bold" fill="#111">3. Redirect to Google/GitHub login</text>

  <!-- Step 4: IdP -> auth-server: user identity -->
  <line x1="535" y1="275" x2="325" y2="275" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="335" y="267" font-size="12.5" font-weight="bold" fill="#111">4. Callback with user identity</text>
  <text x="335" y="285" font-size="11.5" fill="#555">(email, provider_user_id)</text>

  <!-- Step 5: auth-server -> Postgres: resolve/create user -->
  <line x1="325" y1="320" x2="850" y2="320" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="360" y="312" font-size="12.5" font-weight="bold" fill="#111">5. Resolve or create user</text>
  <text x="360" y="330" font-size="11.5" fill="#555">(match by email in users / linked_accounts)</text>

  <!-- Step 6: auth-server -> Redis: validate state -->
  <line x1="325" y1="365" x2="695" y2="365" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="360" y="357" font-size="12.5" font-weight="bold" fill="#111">6. Validate state</text>

  <!-- Step 7: auth-server -> Client: 302 redirect with code -->
  <line x1="315" y1="410" x2="115" y2="410" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="130" y="402" font-size="12.5" font-weight="bold" fill="#111">7. 302 redirect → callback?code=...</text>
  <text x="130" y="420" font-size="11.5" fill="#555">(short-lived authorization code)</text>

  <!-- Step 8: Client -> auth-server: POST /oauth2/token -->
  <line x1="110" y1="465" x2="315" y2="465" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="120" y="457" font-size="12.5" font-weight="bold" fill="#111">8. POST /oauth2/token</text>
  <text x="120" y="475" font-size="11.5" fill="#555">code + code_verifier (PKCE)</text>

  <!-- Step 9: auth-server -> Redis: verify PKCE challenge -->
  <line x1="325" y1="510" x2="695" y2="510" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="360" y="502" font-size="12.5" font-weight="bold" fill="#111">9. Verify code_verifier against</text>
  <text x="360" y="520" font-size="11.5" fill="#555">stored code_challenge</text>

  <!-- Step 10: auth-server -> Postgres: create refresh token -->
  <line x1="325" y1="555" x2="850" y2="555" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="360" y="547" font-size="12.5" font-weight="bold" fill="#111">10. Persist refresh_token</text>

  <!-- Step 11: auth-server -> Client: tokens -->
  <line x1="315" y1="600" x2="115" y2="600" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="130" y="592" font-size="12.5" font-weight="bold" fill="#111">11. access_token (JWT, 15 min) +</text>
  <text x="130" y="610" font-size="11.5" fill="#555">refresh_token (opaque, 7 days)</text>

  <!-- Note box: resource server call, separate/independent -->
  <rect x="60" y="660" width="880" height="150" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="500" y="685" font-size="13" font-weight="bold" text-anchor="middle" fill="#991b1b">Later — using the token (resource-server, not shown as a lifeline above for space)</text>
  <text x="90" y="712" font-size="12" fill="#7f1d1d">12. Client → resource-server: API request + access_token</text>
  <text x="90" y="734" font-size="12" fill="#7f1d1d">13. resource-server fetches/caches auth-server's public key via JWKS (infrequent, cached — not per-request)</text>
  <text x="90" y="756" font-size="12" fill="#7f1d1d">14. resource-server validates JWT signature + claims locally, no call to auth-server needed</text>
  <text x="90" y="778" font-size="12" fill="#7f1d1d">15. resource-server returns the requested resource</text>

  <text x="60" y="840" font-size="11.5" fill="#888" font-style="italic">Note: steps 12-15 are omitted from the lifeline diagram above purely for horizontal space — resource-server</text>
  <text x="60" y="856" font-size="11.5" fill="#888" font-style="italic">is architecturally independent and never participates in steps 1-11.</text>
</svg>
